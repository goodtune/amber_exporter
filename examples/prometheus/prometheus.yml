# Example Prometheus configuration for amber_exporter.

rule_files:
  - rules.yml

scrape_configs:
  - job_name: amber
    # The exporter keeps API data in a cache: the current price for 1 minute.
    # A shorter scrape interval does not give newer data.
    scrape_interval: 1m
    static_configs:
      - targets: ["localhost:10062"]
